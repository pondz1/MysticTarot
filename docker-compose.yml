services:
  mystic-tarot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mystic-tarot
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - PORT=3001
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://9router.jsd.my.id/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-tarot-cards}
    volumes:
      - tarot-data:/app/server/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  tarot-data:
    driver: local
